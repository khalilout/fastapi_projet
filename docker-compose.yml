services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stageflow_user
      POSTGRES_PASSWORD: stageflow_pass
      POSTGRES_DB: stageflow_db
    volumes:
      - stageflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageflow_user -d stageflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://stageflow_user:stageflow_pass@db:5432/stageflow_db"
      SECRET_KEY: "${SECRET_KEY}"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stageflow_pgdata: